# Delegate to the template project's CI config so there is a single source of truth.
# GitLab treats {{ and }} as literal characters in local include paths.
include:
  - local: '{{cookiecutter.project_slug}}/.gitlab-ci.yml'

variables:
  GIT_STRATEGY: clone  # fresh clone each pipeline — avoids stale shallow-marker conflicts on the runner

# tests/test_template_generation.py drives cookiecutter to generate a real project
# for every `repo_type` and runs its lint/typecheck/test cycle — heavier than a
# lint/typecheck pass (two full `uv sync`s, git commits, a `dvc init`) and it relies
# on things only a developer's machine already has (a git identity, mainly). Runs
# locally as a pre-push hook instead (see .pre-commit-config.yaml).
pytest:
  rules:
    - when: never

# mypy runs locally as a pre-push hook instead (see .pre-commit-config.yaml) — the
# shared GEG runner is intentionally small, and mypy over hooks/post_gen_project.py's
# Jinja2 placeholders isn't checkable anyway (see pyproject.toml [tool.mypy] exclude).
mypy_check:
  rules:
    - when: never
