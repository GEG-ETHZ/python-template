[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_short_description }}"
authors = [{name = "{{ cookiecutter.author_name }}"}]
readme = "README.md"
requires-python = ">=3.11"
{% if cookiecutter.repo_type == 'data_project' %}dependencies = [
    # "my-data-package @ git+https://gitlab.ethz.ch/geg/<data_pipeline_pkg>.git"
]
{% else %}dependencies = []
{% endif %}

[dependency-groups]   # e.g. uv add --group dev ruff
dev = [
    "mypy~=1.19",         # static type checker
    "pytest~=9.0",        # testing
    "ruff~=0.15",         # linter and formatter
    "pylsp-mypy~=0.7", # provides connection from python LSP to mypy
    "pylsp-rope~=0.1", # provides linting tools
    "pre-commit~=4.1",    # git hook management
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.project_slug.replace('-', '_') }}"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D400",
    "D415",
    "D205",
]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.project_slug }}"]

[tool.ruff.lint.per-file-ignores]   # otherwise ruff shows "imported but unused" error
"__init__.py" = ["F401"]
"tests/**" = ["D"]                  # no docstring rules inside tests/ folder

[tool.ruff.lint.pydocstyle]   # defines the doc string format
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Enables strict mypy checks; comment this out for projects that do not require strict type checking.
strict = true                       

[tool.pytest.ini_options]
testpaths = ["tests"]
