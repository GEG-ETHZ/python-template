# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_stages: [pre-commit, pre-push]
# Stop at the first failing hook so a cheap failure (e.g. no-commit-to-branch)
# doesn't sit through mypy and the full test suite before reporting.
fail_fast: true

repos:
  # Built-in hooks (first, so the cheap branch guard fails fast)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch # This perfectly replaces the custom bash script by blocking commits AND pushes to main/develop
        args: [--branch, main, --branch, develop]
        stages: [pre-commit, pre-push]
      - id: trailing-whitespace
        exclude: "dvc\\.lock"
      - id: end-of-file-fixer
      - id: check-yaml
        # The blueprint directory contains Jinja2 tags ({% %}) that are not valid YAML.
        exclude: "\\{\\{cookiecutter"
      - id: check-added-large-files

  # Fast checks (run on both commit and push just to be safe)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [ --fix ]
        # Both the blueprint directory and the post-gen hook contain Jinja2 tags
        # that are not valid Python/TOML.
        exclude: "\\{\\{cookiecutter|^hooks/post_gen_project\\.py$"
      - id: ruff-format
        exclude: "\\{\\{cookiecutter|^hooks/post_gen_project\\.py$"  # see ruff above

  # Strict/Slow checks (run ONLY on push)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        args: [ . ]

  # Tests (run ONLY on push)
  - repo: local
    hooks:
      - id: pytest
        name: Run test suite
        entry: uv run pytest -v
        language: system
        files: '\.(py|toml|yaml|yml|lock)$'
        pass_filenames: false
        stages: [pre-push]
