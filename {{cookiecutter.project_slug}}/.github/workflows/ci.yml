# CI pipeline: lint → typecheck → test → auto-tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:           # manual run from the Actions tab

# A newer push cancels the in-progress run for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  mypy_check:
    runs-on: ubuntu-latest
    needs: lint_code
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mypy .

  pytest:
    runs-on: ubuntu-latest
    needs: mypy_check
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -v

  # Tag the PR's source branch tip as bak/<branch> before it is deleted by the
  # squash merge. This preserves CHANGELOG.md comparison links. No extra token
  # is needed: the built-in GITHUB_TOKEN can push tags once the job is granted
  # `contents: write`.
  # Skipped for PRs from forks (their GITHUB_TOKEN is read-only) and for
  # develop / main as source branches.
  tag_branch:
    runs-on: ubuntu-latest
    needs: pytest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'main' && github.head_ref != 'develop'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tag branch tip
        env:
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Guard: if a newer commit was pushed while this run was in progress,
          # skip tagging — the run on that newer commit will tag correctly.
          REMOTE_TIP=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$HEAD_SHA" != "$REMOTE_TIP" ]; then
            echo "Skipping tag: run commit $HEAD_SHA is stale (branch tip is $REMOTE_TIP)."
            exit 0
          fi
          git tag --force "bak/$BRANCH" "$HEAD_SHA"
          git push --force origin "refs/tags/bak/$BRANCH"
