# GitHub Actions counterpart of the root .gitlab-ci.yml. GitLab can `include` the
# blueprint's CI file directly, but GitHub only reads workflows from the root
# .github/workflows/, so this is a trimmed copy of
# {{cookiecutter.project_slug}}/.github/workflows/ci.yml — keep the shared jobs in sync.
#
# As on GitLab, `mypy_check` and `pytest` are omitted: the template-generation tests
# need a git identity and two full `uv sync`s, and mypy can't check the Jinja2
# placeholders in hooks/post_gen_project.py. Both run locally as pre-push hooks
# instead (see .pre-commit-config.yaml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  # See the blueprint workflow for the rationale behind bak/<branch> tags.
  tag_branch:
    runs-on: ubuntu-latest
    needs: lint_code
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'main' && github.head_ref != 'develop'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tag branch tip
        env:
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          REMOTE_TIP=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$HEAD_SHA" != "$REMOTE_TIP" ]; then
            echo "Skipping tag: run commit $HEAD_SHA is stale (branch tip is $REMOTE_TIP)."
            exit 0
          fi
          git tag --force "bak/$BRANCH" "$HEAD_SHA"
          git push --force origin "refs/tags/bak/$BRANCH"
